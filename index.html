<style>
:root{--bg:#efe7d9;--tile:#e7dece;--tile2:#dad0bc;--line:#cfc4ae;--text:#2f2f25;--mute:#7b755e;--g:#566240;--o:#a8794a;--b:#6d7f77;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f5eee3 0%,#efe7d9 45%,#e4dac6 100%) fixed;color:var(--text);font:14px/1.5 system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:3px}.dots i{width:12px;height:12px;border-radius:50%}
.dots i:nth-child(1){background:var(--o)}.dots i:nth-child(2){background:var(--g)}.dots i:nth-child(3){background:var(--b)}
.logo{height:52px;width:auto;display:block}

.tools{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tools button{all:unset;cursor:pointer;color:var(--mute);padding:2px 0;border-bottom:1px solid transparent}
.tools button:hover{color:var(--text)}
.tools button.on{color:var(--text);border-color:var(--g)}
.tools input,.tools select{background:var(--tile2);border:0;border-radius:3px;color:var(--text);font:inherit;letter-spacing:0;text-transform:none;font-size:13px;padding:6px 10px;outline:0}
.tools input{width:200px}.tools input:focus{box-shadow:0 0 0 1px var(--g)}
.sp{margin-left:auto;display:flex;gap:14px;align-items:center}
.count{padding:14px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.t{aspect-ratio:2/3;background:var(--tile);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(70,60,35,.14);padding:12px;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .12s}
.t .im{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:sepia(.35) saturate(.8);animation:fi .4s}
.t .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,22,12,.45),rgba(25,22,12,0) 38%,rgba(25,22,12,.72))}
.t h3,.t .y{position:relative;z-index:1}
.t.has-img h3,.t.has-img .y,.t.has-img .y b{color:#f6efe3;opacity:1}
.t.has-img h3,.t.has-img .y{text-shadow:0 1px 2px rgba(15,12,5,.55),0 0 8px rgba(15,12,5,.3)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.t:hover,.t.open{box-shadow:inset 0 0 0 2px var(--g)}
.t h3{margin:0;font-size:15px;font-weight:500;line-height:1.25;color:var(--text)}
.t .y{margin-top:auto;color:var(--mute);font-size:12px}
.t .y b{display:block;font-weight:400;color:var(--text);opacity:.8}
.t .ov{position:absolute;z-index:2;inset:0;background:rgba(239,231,217,.98);padding:12px;display:none;flex-direction:column;gap:8px;font-size:12px;color:var(--text);overflow:auto}
.t.open .ov{display:flex}
.ov small{color:var(--mute)}
.ov a.go{margin-top:auto;background:var(--g);color:#f5eee3;text-align:center;text-decoration:none;padding:6px;border-radius:3px;font-weight:600;font-size:12px}
.ov a:not(.go){color:var(--g)}
.row{display:grid;grid-template-columns:1fr 110px 90px 70px 44px;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.row:hover{background:var(--tile)}
.row .n{color:var(--text);font-size:15px}.row .n small{display:block;color:var(--mute);font-size:12px}
.row .m{color:var(--mute);font-size:12px;text-align:right}
.row a{color:var(--g);text-decoration:none;text-align:right;font-size:12px}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
@media(max-width:620px){.row{grid-template-columns:1fr 90px 44px}.row .m:nth-of-type(2),.row .m:nth-of-type(3){display:none}.sp{margin-left:0}}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:48px;padding:18px 0 28px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.footer-credit{color:var(--mute)}.footer-credit a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line)}.footer-credit a:hover{color:var(--g);border-color:var(--g)}
.footer-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.footer-icons{display:flex;align-items:center;gap:10px}
.footer-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--tile);border:1px solid var(--line);border-radius:50%;color:var(--text);text-decoration:none;transition:border-color .15s,color .15s,transform .15s}
.footer-btn svg{width:16px;height:16px;display:block}
.footer-btn:hover{border-color:var(--g);color:var(--g);transform:translateY(-1px)}
.footer-join{display:flex;align-items:center;gap:12px}
.footer-sep{width:1px;height:20px;background:var(--line);display:block}
@media(max-width:700px){.site-footer{flex-wrap:wrap;justify-content:center}.footer-right{margin-left:0;flex-wrap:wrap;justify-content:center}}
nav .tag-r{margin-left:auto;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

 "Mihalis Kakogiannis":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHoc9nXi9i-R3RDFSXAivkmRpVDdEvshBtNkOpcsKwonC0KQ8V94fQiKjn&s=10",
 "Liu Chia-liang":"https://www.shoshosein.com/sites/default/files/auteur/liu-chia-liang.jpg",
 "Kunle Afolayan":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxQdmH9uKeUeTBIEbRF1dzWqnNW72YK98HoIksghpoty0uj56lpqF14Ycu&s=10",
 "Franco Piavoli":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9n1hOJ25ccJT9BqNEg1eUMPOqw-j4aEk121LKGIpHQ-II8AAIHc-OywA&s=10",
 "Chang Cheh":"https://image.tmdb.org/t/p/w500/dI0gfxAU5WvI3cg67igYhX3FYGW.jpg",
 "Robert Bresson":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9Uq222Ewl3g2KXGKhR9ii6mXjhh4rLBZzblc9ftQAIJsva0Za-MGAv1dt&s=10"
};
Object.assign(IMG,OVERRIDES);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const last=n=>norm(n.trim()).split(/\s+/).pop();
const api=h=>'https://'+h+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilimit=max&redirects=1&converttitles=1';
const API=api('en');
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return m[b.length]}
const okTitle=(d,title)=>{const l=last(d.name),tol=Math.max(1,Math.floor(l.length*.25));return norm(title).split(/[\s\-–,()]+/).some(w=>w&&lev(w,l)<=tol)};
function applyImg(name,url){
 IMG[name]=url;
 const el=[...document.querySelectorAll('.t')].find(t=>t.dataset.n===name);
 if(!el||el.querySelector('.im'))return;
 const im=document.createElement('div');im.className='im';im.style.backgroundImage="url('"+url+"')";
 el.prepend(im);el.classList.add('has-img');
}
function save(){try{localStorage.setItem(CK,JSON.stringify(IMG))}catch(e){}}
async function fetchBatch(ds){
 const r=await fetch(API+'&titles='+encodeURIComponent(ds.map(d=>d.name.trim()).join('|')));
 const q=(await r.json()).query||{};
 const hop={};[...(q.normalized||[]),...(q.converted||[]),...(q.redirects||[])].forEach(x=>hop[x.from]=x.to);
 const byTitle={};Object.values(q.pages||{}).forEach(p=>byTitle[p.title]=p);
 const missed=[];
 ds.forEach(d=>{
  let t=d.name.trim(),n=0;while(hop[t]&&n++<5)t=hop[t];
  const p=byTitle[t];
  if(p&&p.thumbnail&&okTitle(d,p.title))applyImg(d.name,p.thumbnail.source);else missed.push(d);
 });
 return missed;
}
async function fetchWikidata(d){
 const WD='https://www.wikidata.org/w/api.php?format=json&origin=*';
 for(const s of new Set([d.name.trim(),d.name.trim().split(/ and /)[0]])){
  try{
   const hits=((await(await fetch(WD+'&action=wbsearchentities&language=en&type=item&limit=8&search='+encodeURIComponent(s))).json()).search)||[];
   const cand=hits.filter(h=>/director|filmmaker|film maker|cineast/i.test(h.description||''));
   if(!cand.length)continue;
   const ents=((await(await fetch(WD+'&action=wbgetentities&props=claims&ids='+cand.map(h=>h.id).join('|'))).json()).entities)||{};
   for(const h of cand){
    const c=ents[h.id]&&ents[h.id].claims&&ents[h.id].claims.P18;
    const f=c&&c[0]&&c[0].mainsnak&&c[0].mainsnak.datavalue&&c[0].mainsnak.datavalue.value;
    if(f){applyImg(d.name,'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=400');return true}
   }
  }catch(e){}
 }
 return false;
}
async function fetchArticleImage(d){
 // Last resort: any photo used on the person's own article (covers cases where no "lead image" is set)
 try{
  const A=api('en');
  const sr=await(await fetch(A+'&generator=search&gsrlimit=4&gsrsearch='+encodeURIComponent(d.name.trim()))).json();
  const pages=Object.values((sr.query&&sr.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>okTitle(d,p.title));
  const l=last(d.name);
  for(const p of pages.slice(0,2)){
   const im=await(await fetch(A+'&prop=images&imlimit=60&pageids='+p.pageid)).json();
   const files=(((im.query||{}).pages||{})[p.pageid]||{}).images||[];
   const pick=files.map(f=>f.title).filter(n=>/\.(jpe?g|png)$/i.test(n)&&norm(n).includes(l));
   if(!pick.length)continue;
   const ii=await(await fetch(A+'&prop=imageinfo&iiprop=url&iiurlwidth=400&titles='+encodeURIComponent(pick.slice(0,5).join('|')))).json();
   const hit=Object.values((ii.query||{}).pages||{}).map(x=>x.imageinfo&&x.imageinfo[0]).find(x=>x&&x.thumburl);
   if(hit){applyImg(d.name,hit.thumburl);return true}
  }
 }catch(e){}
 return false;
}
async function fetchSearch(d){
 const n=d.name.trim();
 const tries=[[API,n+' film director'],[api('fr'),n+' réalisateur'],[API,n]];
 for(const [u,q0] of tries){
  try{
   const r=await fetch(u+'&generator=search&gsrlimit=5&gsrsearch='+encodeURIComponent(q0));
   const q=(await r.json()).query||{};
   const p=Object.values(q.pages||{}).sort((a,b)=>a.index-b.index).find(p=>p.thumbnail&&okTitle(d,p.title));
   if(p){applyImg(d.name,p.thumbnail.source);return}
  }catch(e){}
 }
 if(await fetchWikidata(d))return;
 if(await fetchArticleImage(d))return;
 IMG[d.name]='';
}
async function loadImages(){
 const need=D.filter(d=>!(d.name in IMG));
 let missed=[];
 try{
  for(let i=0;i<need.length;i+=20){missed=missed.concat(await fetchBatch(need.slice(i,i+20)));save()}
  for(let i=0;i<missed.length;i+=4){await Promise.all(missed.slice(i,i+4).map(fetchSearch));save()}
 }catch(e){}
}
render();
loadImages();
</script></body></html>
